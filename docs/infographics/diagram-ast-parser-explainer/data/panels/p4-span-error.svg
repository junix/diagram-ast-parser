<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="680" viewBox="0 0 1140 680" role="img" aria-label="字节区间与一行一列错误定位">
<rect x="0.0" y="0.0" width="1140.0" height="680.0" rx="10" fill="#FFFFFF"/>
<rect x="40.0" y="28.0" width="540.0" height="320.0" rx="12" fill="#F7FAFE" stroke="#D5DFEB" stroke-width="1"/>
<text x="64.0" y="64.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="17" fill="#182841" font-weight="700" text-anchor="start">每个语句级节点都带字节区间</text>
<text x="64.0" y="92.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="13.5" fill="#44556E" font-weight="400" text-anchor="start">区间记录 UTF-8 字节偏移的起点与终点；</text>
<text x="64.0" y="116.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="13.5" fill="#44556E" font-weight="400" text-anchor="start">错误报告另给一行一列起算的行列号。</text>
<text x="64.0" y="178.0" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="17" fill="#182841" font-weight="600" text-anchor="start">box 订单 { label 提交 }</text>
<line x1="64.0" y1="192.0" x2="424.0" y2="192.0" stroke="#D5DFEB" stroke-width="1.2"/>
<line x1="64.0" y1="186.0" x2="64.0" y2="198.0" stroke="#2C6BC4" stroke-width="1.6"/>
<text x="64.0" y="218.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="12.5" fill="#44556E" font-weight="400" text-anchor="start">起点 0</text>
<line x1="404.0" y1="186.0" x2="404.0" y2="198.0" stroke="#2C6BC4" stroke-width="1.6"/>
<text x="404.0" y="218.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="12.5" fill="#44556E" font-weight="400" text-anchor="middle">终点 27</text>
<text x="64.0" y="244.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="12.5" fill="#75879D" font-weight="400" text-anchor="start">上面这行共 27 字节（中文每字 3 字节）· 刻度示意</text>
<text x="64.0" y="286.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="13.5" fill="#44556E" font-weight="400" text-anchor="start">区间可取并集（更早起点与更晚终点），供上层做</text>
<text x="64.0" y="310.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="13.5" fill="#44556E" font-weight="400" text-anchor="start">「原文回显 + 指针」式诊断与源映射。</text>
<rect x="610.0" y="28.0" width="490.0" height="320.0" rx="12" fill="#101B2E"/>
<text x="634.0" y="62.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="15.5" fill="#D9E7FA" font-weight="700" text-anchor="start">真实诊断转录（未闭合块）</text>
<text x="634.0" y="94.0" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="13" fill="#BBD4F5" font-weight="400" text-anchor="start">{</text>
<text x="634.0" y="119.0" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="13" fill="#BBD4F5" font-weight="400" text-anchor="start">  &quot;format&quot;: &quot;d2&quot;,</text>
<text x="634.0" y="144.0" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="13" fill="#BBD4F5" font-weight="400" text-anchor="start">  &quot;message&quot;: &quot;unterminated block: expected `}`&quot;,</text>
<text x="634.0" y="169.0" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="13" fill="#BBD4F5" font-weight="400" text-anchor="start">  &quot;span&quot;: null,</text>
<text x="634.0" y="194.0" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="13" fill="#BBD4F5" font-weight="400" text-anchor="start">  &quot;line&quot;: 1,</text>
<text x="634.0" y="219.0" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="13" fill="#BBD4F5" font-weight="400" text-anchor="start">  &quot;column&quot;: 1</text>
<text x="634.0" y="244.0" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="13" fill="#BBD4F5" font-weight="400" text-anchor="start">}</text>
<rect x="634.0" y="224.0" width="177.4" height="26.0" rx="13.0" fill="#1B2C49" stroke="#3D5E92" stroke-width="1"/>
<text x="722.7" y="241.3" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="12" fill="#D9E7FA" font-weight="600" text-anchor="middle">stdin 传入 · 诊断走 stderr</text>
<rect x="884.0" y="224.0" width="70.0" height="26.0" rx="13.0" fill="#1B2C49" stroke="#3D5E92" stroke-width="1"/>
<text x="919.0" y="241.5" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="12.5" fill="#D9E7FA" font-weight="600" text-anchor="middle">退出码 1</text>
<text x="634.0" y="296.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="12.5" fill="#8FA9CC" font-weight="400" text-anchor="start">诊断可要求机器可读的 JSON 形态（诊断开关）</text>
<rect x="40.0" y="380.0" width="1060.0" height="272.0" rx="12" fill="#F2F7FD" stroke="#D5DFEB" stroke-width="1"/>
<text x="64.0" y="414.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="15.5" fill="#182841" font-weight="700" text-anchor="start">诊断对象的五个字段</text>
<rect x="64.0" y="436.0" width="196.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#D5DFEB" stroke-width="1"/>
<text x="80.0" y="464.0" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="14.5" fill="#14477E" font-weight="600" text-anchor="start">format</text>
<text x="80.0" y="492.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="12.5" fill="#44556E" font-weight="400" text-anchor="start">出错的格式</text>
<rect x="276.0" y="436.0" width="196.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#D5DFEB" stroke-width="1"/>
<text x="292.0" y="464.0" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="14.5" fill="#14477E" font-weight="600" text-anchor="start">message</text>
<text x="292.0" y="492.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="12.5" fill="#44556E" font-weight="400" text-anchor="start">人读信息</text>
<rect x="488.0" y="436.0" width="196.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#D5DFEB" stroke-width="1"/>
<text x="504.0" y="464.0" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="14.5" fill="#14477E" font-weight="600" text-anchor="start">span</text>
<text x="504.0" y="492.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="12.5" fill="#44556E" font-weight="400" text-anchor="start">字节区间（可得时）</text>
<rect x="700.0" y="436.0" width="196.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#D5DFEB" stroke-width="1"/>
<text x="716.0" y="464.0" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="14.5" fill="#14477E" font-weight="600" text-anchor="start">line</text>
<text x="716.0" y="492.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="12.5" fill="#44556E" font-weight="400" text-anchor="start">一基行号</text>
<rect x="912.0" y="436.0" width="196.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#D5DFEB" stroke-width="1"/>
<text x="928.0" y="464.0" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="14.5" fill="#14477E" font-weight="600" text-anchor="start">column</text>
<text x="928.0" y="492.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="12.5" fill="#44556E" font-weight="400" text-anchor="start">一基列号</text>
<text x="64.0" y="548.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="13.5" fill="#44556E" font-weight="400" text-anchor="start">未知顶层语句不会被静默丢弃：属性开放的语言把不认识的属性留作通用属性节点，</text>
<text x="64.0" y="574.0" font-family="'PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial',sans-serif" font-size="13.5" fill="#44556E" font-weight="400" text-anchor="start">语义校验属于后续阶段——这是引擎明示的边界。</text>
</svg>

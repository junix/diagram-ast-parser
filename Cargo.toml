[package]
name = "diagram-ast-parser"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Parse DBML, WaveDrom, D2, Structurizr DSL, LikeC4, nomnoml, and Pikchr into typed Rust ASTs"
license = "MIT"
keywords = ["parser", "diagram", "ast", "dbml", "d2"]
categories = ["parser-implementations", "command-line-utilities"]

[lib]
name = "diagram_ast_parser"
path = "src/lib.rs"

[[bin]]
name = "diagram-parse"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
serde_json5 = "=0.2.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
